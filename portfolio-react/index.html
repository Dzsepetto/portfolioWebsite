<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <link
      rel="preload"
      href="/fonts/Bangers.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Pintér Benedek | Portfolio</title>

    <meta
      name="description"
      content="Pintér Benedek portfolio website showcasing web development projects, experience and contact links."
    />

    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #111;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #111;
      }

      .initial-loader__content {
        width: min(320px, 80vw);
        text-align: center;
      }

      .initial-loader__title {
        margin-bottom: 20px;

        color: white;
        font-family: Arial, sans-serif;
        font-size: 32px;
        font-weight: 700;
      }

      .initial-loader__bar {
        position: relative;

        width: 100%;
        height: 4px;

        overflow: hidden;

        background: rgba(255, 255, 255, 0.15);
        border-radius: 999px;
      }

      .initial-loader__bar::after {
        content: "";

        position: absolute;
        top: 0;
        left: 0;

        width: 40%;
        height: 100%;

        background: white;
        border-radius: inherit;

        animation: initial-loading 1s ease-in-out infinite;
      }

      @keyframes initial-loading {
        0% {
          transform: translateX(-120%);
        }

        100% {
          transform: translateX(350%);
        }
      }
    </style>
    
  </head>

  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="initial-loader__content">
          <div class="initial-loader__title">
            Loading
          </div>

          <div class="initial-loader__bar"></div>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="/src/app/main.jsx"
    ></script>
  </body>
</html>
